<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>التسجيل - منصة إلدورادو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Favicons -->
  <link href="..//assets/img/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="..//assets/img/apple-touch-icon.png" rel="apple-touch-icon">
<style>
/* Global font */
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Cairo', sans-serif;
    background-color: #f5f5f5;
    height: 100%;
}

/* Floating Back to Home button */
.back-home-btn {
    position: fixed;
    top: 20px;
    left: 20px; /* في النسخة العربية يكون من اليسار */
    z-index: 9999;
    background-color: #D4AF37;
    color: #fff;
    padding: 12px 25px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s, background-color 0.3s;
}
.back-home-btn:hover {
    background-color: #b8952d;
    transform: scale(1.05);
}

/* Split container for form + image */
.split-container {
    display: flex;
    min-height: 100vh;
    width: 100%;
}

/* Left side - form */
.form-half {
    flex: 1;
    background-color: #FAF9F6;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
}

.form-box {
    width: 100%;
    max-width: 450px;
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
}

form {
    display: flex;
    flex-direction: column;
}

label {
    margin-bottom: 5px;
    font-weight: 600;
    color: #555;
}

input, select {
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

input[type="file"] {
    padding: 5px;
}

button {
    padding: 15px;
    background-color: #D4AF37;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: not-allowed; /* لأن الزر معطل */
    transition: background-color 0.3s, transform 0.3s;
    opacity: 0.6; /* لإظهار أن الزر معطل */
}

.note {
    font-size: 13px;
    color: #666;
    margin-top: -15px;
    margin-bottom: 15px;
    text-align: right; /* RTL */
}

.confirmation {
    font-size: 14px;
    color: #4CAF50;
    margin-top: 10px;
    display: none;
}

/* Right side - image */
.image-half {
    flex: 1;
    background: url('../assets/img/signup-image.png') center center/cover no-repeat;
}

/* Responsive */
@media (max-width: 900px) {
    .split-container {
        flex-direction: column;
    }
    .image-half {
        height: 250px;
    }
}
</style>
</head>
<body>

<!-- Floating Back to Home button -->
<a href="index_ar.html" class="back-home-btn">العودة للرئيسية</a>

<div class="split-container">
    <!-- Left side: signup form -->
    <div class="form-half">
        <div class="form-box">
            <h1>إنشاء حساب جديد</h1>
            <form id="signupForm" enctype="multipart/form-data">
                <label for="firstName">الاسم الأول</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">اسم العائلة</label>
                <input type="text" id="lastName" name="lastName" required>

                <label for="dob">تاريخ الميلاد</label>
                <input type="date" id="dob" name="dob" required>

                <label for="country">البلد</label>
                <select id="country" name="country" required>
                    <option value="">اختر بلدك</option>
                    <option value="US">الولايات المتحدة</option>
                    <option value="UK">المملكة المتحدة</option>
                    <option value="CA">كندا</option>
                    <option value="AE">الإمارات العربية المتحدة</option>
                    <option value="SA">المملكة العربية السعودية</option>
                </select>

                <label for="idDocument">رفع وثيقة رسمية (جواز سفر / هوية)</label>
                <input type="file" id="idDocument" name="idDocument" accept=".jpg,.jpeg,.png,.pdf" required>
                <div class="note">الصيغ المسموح بها: JPG, PNG, PDF</div>

                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required>

                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required>

                <div class="note" style="color:red; font-weight:bold; text-align:center;">
<center>
  <strong style="color:red;">
    التسجيل العام مؤقتاً غير متاح. الوصول يتم فقط عبر الدعوات. 
    <a href="mailto:eldorado@ieforum.online
?subject=%D8%B7%D9%84%D8%A8%20%D8%AF%D8%B9%D9%88%D8%A9%20-%20%D9%85%D8%B4%D8%B1%D9%88%D8%B9%20%D8%A5%D9%84%D8%AF%D9%88%D8%B1%D8%A7%D8%AF%D9%88
&body=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%20%D9%81%D8%B1%D9%8A%D9%82%20%D8%A5%D9%84%D8%AF%D9%88%D8%B1%D8%A7%D8%AF%D9%88,%0D%0A%0D%0A%D8%A3%D9%88%D8%AF%20%D8%B7%D9%84%D8%A8%20%D8%AF%D8%B9%D9%88%D8%A9%20%D9%84%D9%84%D9%88%D8%B5%D9%88%D9%84%20%D8%A5%D9%84%D9%89%20%D9%85%D8%B4%D8%B1%D9%88%D8%B9%20%D8%A5%D9%84%D8%AF%D9%88%D8%B1%D8%A7%D8%AF%D9%88.%0D%0A%0D%0A%D8%A7%D9%84%D8%A7%D8%B3%D9%85:%0D%0A%D8%A7%D9%84%D8%AC%D9%86%D8%B3%D9%8A%D8%A9:%0D%0A%D8%A7%D9%84%D8%A8%D9%84%D8%AF%20%D8%A7%D9%84%D8%A5%D9%82%D8%A7%D9%85%D8%A9:%0D%0A%D8%A7%D9%84%D8%AC%D9%87%D8%A9/%D8%A7%D9%84%D8%B4%D8%B1%D9%83%D8%A9:%0D%0A%0D%0A%D9%85%D8%B9%20%D8%AA%D8%AD%D9%8A%D8%A7%D8%AA%D9%8A,">
      الرجاء التواصل معنا
    </a>
  </strong>
</center>



                </div>

                <button disabled type="submit">تسجيل</button>
                <div class="confirmation" id="confirmationMessage">تم إرسال بريد إلكتروني للتأكيد. يرجى التحقق من صندوق الوارد.</div>
            </form>
        </div>
    </div>

    <!-- Right side: image -->
    <div class="image-half"></div>
</div>

<script>
// Show confirmation message on form submit
document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('confirmationMessage').style.display = 'block';
});
</script>

</body>
</html>
