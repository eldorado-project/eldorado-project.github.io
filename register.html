<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Sign Up - Investment Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
<style>
/* Global font */
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Cairo', sans-serif;
    background-color: #f5f5f5;
    height: 100%;
}

/* Floating Back to Home button */
.back-home-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    background-color: #D4AF37;
    color: #fff;
    padding: 12px 25px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s, background-color 0.3s;
}
.back-home-btn:hover {
    background-color: #b8952d;
    transform: scale(1.05);
}

/* Split container for form + image */
.split-container {
    display: flex;
    min-height: 100vh;
    width: 100%;
}

/* Left side - form */
.form-half {
    flex: 1;
    background-color: #FAF9F6;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    box-sizing: border-box;
}

.form-box {
    width: 100%;
    max-width: 450px;
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
}

form {
    display: flex;
    flex-direction: column;
}

label {
    margin-bottom: 5px;
    font-weight: 600;
    color: #555;
}

input, select {
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

input[type="file"] {
    padding: 5px;
}

button {
    padding: 15px;
    background-color: #D4AF37;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s, transform 0.3s;
}
button:disabled {
    background-color: #bdbdbd;
    color: #777;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
    opacity: 0.8;
}

button:hover {
    background-color: #b8952d;
    transform: scale(1.02);
}

.note {
    font-size: 13px;
    color: #666;
    margin-top: -15px;
    margin-bottom: 15px;
}

.confirmation {
    font-size: 14px;
    color: #4CAF50;
    margin-top: 10px;
    display: none;
}

/* Right side - image */
.image-half {
    flex: 1;
    background: url('assets/img/signup-image.png') center center/cover no-repeat;
}


/* Responsive */
@media (max-width: 900px) {
    .split-container {
        flex-direction: column;
    }
    .image-half {
        height: 250px;
    }
}
</style>
</head>
<body>

<!-- Floating Back to Home button -->
<a href="index.html" class="back-home-btn">Back to Home</a>

<div class="split-container">
    <!-- Left side: signup form -->
    <div class="form-half">
        <div class="form-box">
            <h1>Create Your Account</h1>
            <form id="signupForm" enctype="multipart/form-data">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="">Select your country</option>
                    <option value="US">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="CA">Canada</option>
                    <option value="AE">United Arab Emirates</option>
                    <option value="SA">Saudi Arabia</option>
                </select>

                <label for="idDocument">Upload Official ID (Passport/ID)</label>
                <input type="file" id="idDocument" name="idDocument" accept=".jpg,.jpeg,.png,.pdf" required>
                <div class="note">Accepted formats: JPG, PNG, PDF</div>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
<center>
  <strong style="color:red;">
    PUBLIC REGISTRATION IS TEMPORARILY RESTRICTED. ACCESS IS GRANTED BY INVITATION ONLY. <a href="mailto:eldorado@ieforum.online
?subject=Invitation%20Request%20-%20ELDORADO%20Project
&body=Hello%20ELDORADO%20Team,%0D%0A%0D%0AI%20would%20like%20to%20request%20an%20invitation%20to%20access%20the%20ELDORADO%20Project.%0D%0A%0D%0AName:%0D%0ANationality:%0D%0ACountry%20of%20Residence:%0D%0AOrganization:%0D%0A%0D%0AKind%20regards,">
PLEASE CONTACT US
</a>

  </strong>
</center>                <button  type="submit" disabled>Sign Up</button>
				
                <div class="confirmation" id="confirmationMessage">A confirmation email has been sent. Please check your inbox.</div>
            </form>
        </div>
    </div>

    <!-- Right side: image -->
    <div class="image-half"></div>
</div>

<script>
// Show confirmation message on form submit
document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('confirmationMessage').style.display = 'block';
});
</script>

</body>
</html>
